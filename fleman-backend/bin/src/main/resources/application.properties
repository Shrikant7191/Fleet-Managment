# All timestamps (booking_date, invoice_date, etc.) are handled in the
# server's default timezone — set to IST for this India-based deployment
# (see FlemanApplication's static initializer for the actual JVM setting).
spring.application.name=fleman-backend-full
server.port=8080
spring.jackson.time-zone=Asia/Kolkata

spring.datasource.url=jdbc:mysql://localhost:3306/tempfleet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HS256 signing key for issued JWTs — override in production via an
# environment variable, never commit a real secret here.
app.jwt.secret=change-this-to-a-long-random-secret-before-any-real-deployment-32chars-min
app.jwt.expiration-ms=86400000
